<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passport Bulk</title><link rel="stylesheet" href="/style.css"></head><body><main><header><div><span class="eyebrow">IMAGE OPERATIONS</span><h1>Passport batches</h1></div><button id="new">New batch</button></header><section id="setup" class="card"><div class="settings"><label>Batch name<input id="name" placeholder="November registrations"></label><label>Background<input id="background" type="color" value="#ffffff"></label><label>Dimensions<select id="dimensions"><option value="600x600">600 x 600 px</option><option value="413x531">35 x 45 mm</option></select></label><label>Format<select id="format"><option value="jpg">JPG</option><option value="png">PNG</option></select></label><label>Quality<input id="quality" type="number" min="1" max="100" value="90"></label><label>DPI<input id="dpi" type="number" min="72" max="600" value="300"></label><label><input id="autoDetect" type="checkbox" checked> Detect printed photo</label><label><input id="enhance" type="checkbox" checked> Restore and sharpen</label></div><div id="drop"><b>Drop photos or folders here</b><span>JPG, PNG and HEIC</span><input id="pick" type="file" multiple accept=".jpg,.jpeg,.png,.heic"><input id="folder" type="file" multiple webkitdirectory></div><div class="actions"><button id="zip">Upload ZIP</button><input id="zipfile" hidden type="file" accept=".zip"><button id="create">Create batch & upload</button></div><div id="uploadStatus"></div></section><section id="dashboard" hidden><div class="card summary"><div><span class="eyebrow" id="batchName"></span><h2 id="headline">Batch</h2></div><div id="counts"></div><button id="start">Start processing</button><a id="export">Download ZIP</a></div><nav id="filters"><button data-f="all">All</button><button data-f="processing">Processing</button><button data-f="completed">Completed</button><button data-f="needs_review">Review</button><button data-f="failed">Failed</button><button data-f="queued">Queued</button></nav><section class="card"><div class="bar"><i id="progress"></i></div><table><thead><tr><th>Original filename</th><th>Output filename</th><th>Status</th><th>Details</th><th></th></tr></thead><tbody id="rows"></tbody></table></section></section></main><script src="/app.js"></script></body></html>
